arch{width:min(360px,30vw);height:40px;border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;padding:0 12px;gap:8px}.search input{border:0;outline:0;width:100%;background:transparent}.date{height:40px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:#fff}.top-icon{border:0;background:#fff;font-size:19px;position:relative}.top-icon i{position:absolute;right:-4px;top:-5px;background:#e33;color:#fff;font-style:normal;font-size:9px;border-radius:20px;padding:2px 5px}.user{display:flex;align-items:center;gap:9px;border-left:1px solid var(--line);padding-left:12px}.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#d9b08a,#8b5a35);display:grid;place-items:center;color:#fff;font-weight:800}.user small{display:block;color:var(--muted);font-size:10px}.page{max-width:1500px;margin:auto;padding:24px}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:18px}.head h1{margin:0;font-size:27px}.head p{margin:4px 0 0;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 14px;font-weight:700;color:#34463d}.btn:hover{border-color:#8dcaa5}.primary{background:var(--g700);border-color:var(--g700);color:#fff}.soft{background:#effaf3;border-color:#b9e1c7;color:var(--g700)}.danger{background:#fff4f3;border-color:#ffc6c1;color:#c83a34}.grid{display:grid;gap:14px}.cols-4{grid-template-columns:repeat(4,1fr)}.cols-2{grid-template-columns:minmax(0,1.55fr) minmax(320px,.75fr)}.card{background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);padding:16px}.card-title{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:13px}.title-left{display:flex;gap:10px}.iconbox{width:39px;height:39px;border-radius:10px;background:#dff8e8;color:var(--g700);display:grid;place-items:center;font-size:20px;flex:none}.card h2{font-size:17px;margin:0}.sub{font-size:11px;color:var(--muted);margin-top:2px}.kpi{display:flex;gap:12px;align-items:center}.kpi .iconbox{width:45px;height:45px}.kpi b{display:block;font-size:25px;line-height:1.1}.kpi small{color:var(--muted)}.kpi .trend{margin-left:auto;font-size:11px;color:var(--g700);background:var(--g100);padding:4px 7px;border-radius:20px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:13px}.tab{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 11px;font-weight:650;color:#5a6b62}.tab.active{background:var(--g700);border-color:var(--g700);color:#fff}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:680px}.table th{text-align:left;color:#73837b;background:#f7faf8;font-size:11px;padding:10px}.table td{padding:11px 10px;border-top:1px solid #edf2ef;font-size:12px;vertical-align:middle}.pill{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:4px 9px;font-size:11px;font-weight:750;background:#e3f7e9;color:#08733d}.pill.blue{background:#e7f1ff;color:#236cb1}.pill.amber{background:#fff2d8;color:#9b650c}.pill.red{background:#ffe8e6;color:#c63c37}.dot{width:7px;height:7px;border-radius:50%;background:currentColor}.progress{height:7px;background:#e8efeb;border-radius:20px;overflow:hidden}.progress span{display:block;height:100%;background:#16a15a}.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.quick button{border:1px solid var(--line);background:#fbfdfc;border-radius:11px;padding:13px;text-align:left}.quick button:hover{border-color:#8ac7a1;background:#f3fbf6}.quick b{display:block;margin-top:5px}.quick small{color:var(--muted)}.timeline{display:grid;gap:12px}.event{display:grid;grid-template-columns:13px 1fr;gap:10px}.event:before{content:'';width:10px;height:10px;border-radius:50%;background:var(--g600);margin-top:5px;box-shadow:0 0 0 4px #e7f7ed}.event p{margin:0}.event small{color:var(--muted)}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.field.full{grid-column:1/-1}.label{display:block;font-weight:700;font-size:12px;margin:0 0 6px}.req{color:#df4540}.input,.select,.textarea{width:100%;border:1px solid #d8e3de;border-radius:9px;background:#fff;padding:9px 11px;outline:none;color:#35483f}.input:focus,.select:focus,.textarea:focus{border-color:#31a866;box-shadow:0 0 0 3px #e7f7ed}.textarea{min-height:88px;resize:vertical}.choices{display:flex;gap:8px;flex-wrap:wrap}.choice{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 13px;font-weight:650}.choice.active{background:#effbf3;border-color:#64c48a;color:#08723d}.rule{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #edf2ef}.rule:last-child{border-bottom:0}.switch{width:43px;height:24px;border:0;border-radius:30px;background:#b8c8c0;padding:3px}.switch:before{content:'';display:block;width:18px;height:18px;background:#fff;border-radius:50%;transition:.18s}.switch.on{background:#079b50}.switch.on:before{transform:translateX(19px)}.notice{border:1px solid #c9e7d4;background:#f2fbf5;border-radius:10px;padding:11px 12px;font-size:12px}.notice.warn{border-color:#f0d4a2;background:#fffaf0;color:#78510b}.notice.red{border-color:#ffc9c5;background:#fff5f4;color:#a9332e}.sticky-actions{position:sticky;bottom:0;background:#f4f7f5e8;backdrop-filter:blur(8px);padding:12px 0 2px;display:flex;justify-content:flex-end;gap:8px}.modal-wrap{position:fixed;inset:0;background:#0c261b80;z-index:20;display:none;place-items:center;padding:18px}.modal-wrap.show{display:grid}.modal{width:min(850px,96vw);max-height:90vh;overflow:auto;background:#fff;border-radius:15px;box-shadow:0 30px 90px #0003}.modal-head{padding:17px 19px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.modal-body{padding:18px}.modal-foot{padding:14px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}.toast{position:fixed;right:22px;bottom:22px;background:#153d2a;color:#fff;border-radius:10px;padding:12px 16px;transform:translateY(20px);opacity:0;pointer-events:none;transition:.2s;z-index:30}.toast.show{opacity:1;transform:none}.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed #cfded6;border-radius:11px}.geo{height:310px;border-radius:12px;overflow:hidden;position:relative;background:linear-gradient(25deg,#a7c59e,#dce9d3)}.geo:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(35deg,#ffffff22 0 2px,transparent 2px 34px),repeating-linear-gradient(125deg,#ffffff25 0 2px,transparent 2px 45px)}.polygon{position:absolute;left:16%;top:16%;width:65%;height:66%;background:#0c9b5140;border:3px solid #10a95a;clip-path:polygon(14% 18%,75% 4%,95% 58%,68% 93%,7% 73%)}.pin{position:absolute;left:50%;top:45%;font-size:30px}.geo-tools{position:absolute;left:10px;top:10px;display:grid;gap:6px}.geo-tools button{border:1px solid #dbe7e0;background:#fff;border-radius:7px;padding:7px 9px}.geo-tools button:first-child{background:var(--g700);color:#fff}.help{font-size:11px;color:var(--muted);margin-top:5px}.section-gap{margin-top:14px}.hidden{display:none!important}
@media(max-width:1100px){.app{grid-template-columns:215px 1fr}.cols-4{grid-template-columns:repeat(2,1fr)}.cols-2{grid-template-columns:1fr}.date{display:none}}
@media(max-width:760px){.app{display:block}.sidebar{position:fixed;left:-260px;width:250px;z-index:15;transition:.2s}.sidebar.open{left:0}.mobile{display:block}.topbar{padding:0 12px}.crumb,.user div:not(.avatar){display:none}.search{width:auto;flex:1}.page{padding:16px 12px}.head{align-items:flex-start;display:block}.actions{margin-top:12px}.cols-4,.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.quick{grid-template-columns:1fr}.card{padding:13px}}

<body><div class="app"><aside class="sidebar" id="side"><div class="brand"><div class="leaf">🌱</div><div><b>আমার ফার্ম</b><small>কৃষি ব্যবস্থাপনা প্ল্যাটফর্ম</small></div></div><nav class="nav" id="nav">
<button class="active" data-view="dashboard"><span class="ico">⌂</span>ড্যাশবোর্ড</button><button data-view="farmers"><span class="ico">♟</span>কৃষক ব্যবস্থাপনা</button><button data-view="tasks"><span class="ico">▣</span>কাজ ব্যবস্থাপনা</button><button data-view="locations"><span class="ico">⌖</span>ফার্ম লোকেশন</button><button data-view="monitor"><span class="ico">◉</span>কার্যক্রম পর্যবেক্ষণ</button><button data-view="reports"><span class="ico">▥</span>রিপোর্ট</button><button data-view="notifications"><span class="ico">♧</span>নোটিফিকেশন <span class="badge">3</span></button><button data-view="settings"><span class="ico">⚙</span>সেটিংস</button></nav><div class="sidebar-foot"><b>টেকসই কৃষি<br>সমৃদ্ধ বাংলাদেশ</b><br><span style="opacity:.75">Bashir Agro Admin</span></div></aside>
<main class="main"><header class="topbar"><button class="mobile" id="menu">☰</button><div class="crumb" id="crumb">ড্যাশবোর্ড</div><div class="spacer"></div><select class="date"><option>এই মাস</option><option>গত ৭ দিন</option><option>গত ৩০ দিন</option></select><label class="search">⌕ <input id="search" placeholder="কৃষক, লোকেশন বা কাজ খুঁজুন..."></label><button class="top-icon" data-view="notifications">♧<i>3</i></button><div class="user"><div class="avatar">আ</div><div><b>আব্দুল রহমান</b><small>অ্যাডমিন</small></div></div></header><div id="app"></div></main></div><div class="modal-wrap" id="modal"></div><div class="toast" id="toast"></div>
<script>
const app=document.getElementById('app'),modal=document.getElementById('modal'),toast=document.getElementById('toast');
const S={view:'dashboard',photoCount:3,live:true,galleryBlocked:true,geofence:true,appAccess:true,locations:['উত্তর মাঠ - ধান-১'],farmer:'মোঃ রহিম উদ্দিন'};
const btn=(t,c='',a='')=>`<button class="btn ${c}" data-action="${a}">${t}</button>`;
const pill=(t,c='')=>`<span class="pill ${c}"><span class="dot"></span>${t}</span>`;
const field=(l,p='',full=false,type='text')=>`<label class="field ${full?'full':''}"><span class="label">${l}</span><input class="input" type="${type}" placeholder="${p}"></label>`;
const select=(l,opts,full=false)=>`<label class="field ${full?'full':''}"><span class="label">${l}</span><select class="select">${opts.map(x=>`<option>${x}</option>`).join('')}</select></label>`;
const card=(title,sub,icon,body,extra='')=>`<section class="card ${extra}"><div class="card-title"><div class="title-left"><span class="iconbox">${icon}</span><div><h2>${title}</h2>${sub?`<div class="sub">${sub}</div>`:''}</div></div></div>${body}</section>`;
const head=(title,sub,actions='')=>`<div class="head"><div><h1>${title}</h1><p>${sub}</p></div><div class="actions">${actions}</div></div>`;
function showToast(x){toast.textContent=x;toast.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove('show'),2200)}
function kpi(icon,n,label,trend){return `<div class="card kpi"><span class="iconbox">${icon}</span><div><b>${n}</b><small>${label}</small></div>${trend?`<span class="trend">${trend}</span>`:''}</div>`}
function dashboard(){return head('ড্যাশবোর্ড','আজকের ফার্ম অপারেশন, কৃষক ও কাজের অবস্থা এক নজরে',btn('+ নতুন কৃষক','soft','new-farmer')+btn('+ নতুন কাজ','primary','new-task'))+`<div class="grid cols-4">${kpi('♟','২৪','সক্রিয় কৃষক','+২ এই মাসে')}${kpi('▣','১৮','আজকের কাজ','১২ সম্পন্ন')}${kpi('⌖','৩২','সক্রিয় লোকেশন','১০০% সক্রিয়')}${kpi('⚠','৪','মনোযোগ প্রয়োজন','২টি দেরি')}</div><div class="grid cols-2 section-gap"><div class="grid">${card('আজকের কাজ','কাজের অবস্থা ও সময়সীমা','▣',`<div class="tabs"><button class="tab active">সব (১৮)</button><button class="tab">চলমান (৪)</button><button class="tab">দেরি (২)</button><button class="tab">সম্পন্ন (১২)</button></div><div class="table-wrap"><table class="table"><thead><tr><th>কৃষক</th><th>কাজ</th><th>লোকেশন</th><th>সময়</th><th>অবস্থা</th><th></th></tr></thead><tbody><tr><td>মোঃ রহিম উদ্দিন</td><td>ধানের জমিতে সার প্রয়োগ</td><td>উত্তর মাঠ</td><td>০৮:০০-১০:০০</td><td>${pill('চলমান','blue')}</td><td>${btn('দেখুন','','monitor')}</td></tr><tr><td>মোঃ কামাল উদ্দিন</td><td>ফসল পর্যবেক্ষণ</td><td>দক্ষিণ প্লট</td><td>১০:০০-১১:০০</td><td>${pill('সম্পন্ন')}</td><td>${btn('দেখুন','','monitor')}</td></tr><tr><td>মোঃ রফিকুল ইসলাম</td><td>পুকুরে খাবার প্রদান</td><td>পূর্ব পুকুর</td><td>০৭:০০-০৮:০০</td><td>${pill('দেরি','red')}</td><td>${btn('দেখুন','','monitor')}</td></tr></tbody></table></div>`)}</div><div class="grid">${card('দ্রুত কাজ','সবচেয়ে বেশি ব্যবহৃত অ্যাকশন','⚡',`<div class="quick"><button data-action="new-farmer">♟<b>কৃষক যোগ করুন</b><small>নতুন কৃষক অ্যাকাউন্ট</small></button><button data-action="new-task">▣<b>কাজ তৈরি করুন</b><small>কাজের টেমপ্লেট ও নিয়ম</small></button><button data-action="new-location">⌖<b>লোকেশন যোগ করুন</b><small>জিও-ফেন্সসহ</small></button><button data-action="assign">✓<b>কাজ বরাদ্দ করুন</b><small>এক কৃষককে এক কাজ</small></button></div>`)}${card('সাম্প্রতিক কার্যক্রম','শেষ আপডেটগুলো','◉',`<div class="timeline"><div class="event"><div></div><p><b>রহিম উদ্দিন</b> কাজ শুরু করেছেন<br><small>উত্তর মা function taskForm(){openModal('নতুন কাজ তৈরি করুন',`<div class="form-grid">${field('কাজের নাম <span class="req">*</span>','যেমন: জমিতে সার প্রয়োগ')}${field('কাজ কোড','TK-001')}${select('কাজের শ্রেণি',['সবজি চাষ','মাছ চাষ','গরু পালন','অন্যান্য'])}${select('পুনরাবৃত্তি',['এককালীন','দৈনিক','সাপ্তাহিক','মাসিক'])}${field('নির্দেশনা <span class="req">*</span>','কৃষকের জন্য সংক্ষিপ্ত নির্দেশনা',true)}</div><div class="section-gap">${card('প্রমাণ ও যাচাই','কাজ জমা দেওয়ার শর্ত','✓',`<div class="rule"><span><b>প্রয়োজনীয় ছবি</b><div class="sub">১-১০টি; বর্তমানে ৩টি</div></span><div><button class="btn" data-action="minus">−</button> <b id="pc">${S.photoCount}</b> <button class="btn" data-action="plus">+</button></div></div><div class="rule"><span><b>রিয়েল-টাইম ক্যামেরা ছবি</b><div class="sub">গ্যালারি থেকে পুরনো ছবি নয়</div></span><button class="switch on" data-switch></button></div><div class="rule"><span><b>জিও-ফেন্স যাচাই</b><div class="sub">বাইরে থাকলে বৈধ সাবমিশন ব্লক</div></span><button class="switch on" data-switch></button></div><div class="notice warn section-gap">সময় পেরিয়ে গেলেও কৃষক সাবমিট করতে পারবেন; সিস্টেম সেটিকে Late হিসেবে চিহ্নিত করবে।</div>`)}</div>`,'কাজ সংরক্ষণ করুন')}
function locationForm(){openModal('নতুন লোকেশন যোগ করুন',`<div class="form-grid">${field('লোকেশনের নাম <span class="req">*</span>','যেমন: উত্তর মাঠ')}${field('লোকেশন কোড','L-008')}${select('লোকেশনের ধরন',['সবজি ক্ষেত','মাছের পুকুর','গরুর খামার','স্টোর','অন্যান্য'])}${field('জমির পরিমাণ','২.৫০ একর')}${field('প্রশাসনিক ঠিকানা <span class="req">*</span>','গ্রাম, উপজেলা, জেলা',true)}</div><div class="section-gap"><div class="geo"><div class="polygon"></div><div class="pin">📍</div><div class="geo-tools"><button>সীমানা আঁকুন</button><button>পিন বসান</button><button>মুছুন</button></div></div></div><div class="form-grid section-gap">${field('কেন্দ্র GPS','24.7471, 90.4203')}${field('বাফার রেডিয়াস','20 মিটার')}</div><div class="notice section-gap">Owner তৈরি করলে লোকেশনটি সংরক্ষণের পরই <b>সক্রিয়</b> হবে; আলাদা approval ধাপ নেই।</div>`,'লোকেশন সংরক্ষণ করুন')}
function assignForm(){openModal('কৃষকের কাছে কাজ বরাদ্দ করুন',`<div class="notice"><b>বরাদ্দ নিয়ম:</b> একজন কৃষক একাধিক কাজ পেতে পারেন, কিন্তু একই কাজ একাধিক কৃষককে বরাদ্দ করা যাবে না।</div><div class="form-grid section-gap">${select('কৃষক <span class="req">*</span>',['মোঃ রহিম উদ্দিন (F-006)','মোঃ কামাল উদ্দিন (F-009)'])}${select('কাজ <span class="req">*</span>',['ধানের জমিতে সার প্রয়োগ','পুকুরে খাবার প্রদান'])}${select('লোকেশন <span class="req">*</span>',['উত্তর মাঠ - ধান-১','দক্ষিণ মাঠ - ধান-২'])}${select('অগ্রাধিকার',['সাধারণ','গুরুত্বপূর্ণ','জরুরি'])}${field('তারিখ <span class="req">*</span>','',false,'date')}${field('শুরুর সময় <span class="req">*</span>','',false,'time')}${field('শেষ সময়','',false,'time')}</div><div class="notice warn section-gap">কাজ নির্ধারিত সময়ের পরে জমা দিলে সাবমিশন গ্রহণ হবে, তবে <b>Late</b> হিসেবে রিপোর্ট ও নোটিফিকেশনে দেখাবে।</div>`,'কাজ বরাদ্দ করুন')}
function render(v=S.view){S.view=v;document.getElementById('crumb').textContent=({dashboard:'ড্যাশবোর্ড',farmers:'কৃষক ব্যবস্থাপনা',tasks:'কাজ ব্যবস্থাপনা',locations:'ফার্ম লোকেশন',monitor:'কার্যক্রম পর্যবেক্ষণ',reports:'রিপোর্ট',notifications:'নোটিফিকেশন',settings:'সেটিংস'})[v]||'';document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x.dataset.view===v));app.innerHTML=`<div class="page">${({dashboard:dashboard,farmers:farmers,tasks:tasks,locations:locations,monitor:monitor,reports:reports,notifications:notifications,settings:settings}[v]||dashboard)()}</div>`;bind()}
function action(a){if(a==='new-farmer')farmerForm();else if(a==='new-task')taskForm();else if(a==='new-location')locationForm();else if(a==='assign')assignForm();else if(a==='close'){modal.classList.remove('show')}else if(a==='save-modal'){modal.classList.remove('show');showToast('তথ্য সফলভাবে সংরক্ষণ করা হয়েছে')}else if(a==='plus'){S.photoCount=Math.min(10,S.photoCount+1);document.getElementById('pc').textContent=S.photoCount}else if(a==='minus'){S.photoCount=Math.max(1,S.photoCount-1);document.getElementById('pc').textContent=S.photoCount}else if(['monitor','reports'].includes(a))render(a);else if(a==='farmer-summary')showToast('কৃষকের বিস্তারিত সারাংশ খোলা হয়েছে')}
function bind(){document.querySelectorAll('[data-view]').forEach(x=>x.onclick=()=>render(x.dataset.view));document.querySelectorAll('[data-action]').forEach(x=>x.onclick=()=>action(x.dataset.action));document.querySelectorAll('[data-switch]').forEach(x=>x.onclick=()=>x.classList.toggle('on'));document.querySelectorAll('.choice').forEach(x=>x.onclick=()=>{x.parentElement.querySelectorAll('.choice').forEach(y=>y.classList.remove('active'));x.classList.add('active')})}
document.getElementById('menu').onclick=()=>document.getElementById('side').classList.toggle('open');document.getElementById('search').onkeydown=e=>{if(e.key==='Enter')showToast(`“${e.target.value}” এর জন্য অনুসন্ধান করা হয়েছে`)};render();
</script></body></html>
